[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selveri"
version = "0.8.0"
description = "SelVeri: Self-Verifying Programming Language"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lark",
    "ltlf2dfa",
    "z3-solver",
]

[project.scripts]
selveri = "selveri.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
